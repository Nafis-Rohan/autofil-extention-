<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Job Autofill - Profile</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 520px;
        margin: 24px auto;
      }
      label {
        display: block;
        margin: 10px 0 2px;
        font-size: 13px;
      }
      input,
      select {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }
      input[type="checkbox"] {
        width: auto;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <h2>Personal info</h2>
    <label>First name</label><input data-path="personal.firstName" />
    <label>Last name</label><input data-path="personal.lastName" />
    <label>Email</label><input data-path="personal.email" /> <label>Phone</label
    ><input data-path="personal.phone" placeholder="+8801XXXXXXXXX" />
    <label>Date of birth</label
    ><input data-path="personal.dateOfBirth" placeholder="YYYY-MM-DD" />
    <label>Gender</label><input data-path="personal.gender" />
    <label>Nationality</label><input data-path="personal.nationality" />
    <label>Address</label><input data-path="personal.address" />
    <label>City</label><input data-path="personal.city" />
    <label>Postal code</label><input data-path="personal.postalCode" />
    <label>Country</label><input data-path="personal.country" />

    <h2>Links</h2>
    <label>LinkedIn</label><input data-path="links.linkedin" />
    <label>GitHub</label><input data-path="links.github" />
    <label>Portfolio</label><input data-path="links.portfolio" />
    <label>LeetCode</label><input data-path="links.leetcode" />

    <h2>Education</h2>
    <label>University</label><input data-path="education.university" />
    <label>Degree</label><input data-path="education.degree" />
    <label>Major</label><input data-path="education.major" /> <label>CGPA</label
    ><input data-path="education.cgpa" /> <label>CGPA scale</label
    ><input data-path="education.cgpaScale" placeholder="4.00" />
    <label>Start year</label><input data-path="education.startYear" />
    <label>Graduation year</label><input data-path="education.graduationYear" />

    <h3>HSC</h3>
    <label>Board</label><input data-path="education.hsc.board" />
    <label>Passing year</label><input data-path="education.hsc.year" />
    <label>GPA</label><input data-path="education.hsc.gpa" />

    <h3>SSC</h3>
    <label>Board</label><input data-path="education.ssc.board" />
    <label>Passing year</label><input data-path="education.ssc.year" />
    <label>GPA</label><input data-path="education.ssc.gpa" />

    <h2>Experience</h2>
    <label>Current company</label
    ><input data-path="experience.currentCompany" /> <label>Current title</label
    ><input data-path="experience.currentTitle" />
    <label>Total years of experience</label
    ><input data-path="experience.totalYears" />

    <h2>Preferences</h2>
    <label>Expected salary</label
    ><input data-path="preferences.expectedSalary" />
    <label>Current salary</label><input data-path="preferences.currentSalary" />
    <label>Notice period</label
    ><input data-path="preferences.noticePeriod" placeholder="e.g. 30 days" />
    <label>Work mode</label>
    <select data-path="preferences.workMode">
      <option value="">-</option>
      <option>Remote</option>
      <option>Hybrid</option>
      <option>Onsite</option>
    </select>
    <label>Job type</label>
    <select data-path="preferences.jobType">
      <option value="">-</option>
      <option>Full-time</option>
      <option>Part-time</option>
      <option>Internship</option>
      <option>Contract</option>
    </select>
    <label
      ><input type="checkbox" data-path="preferences.willingToRelocate" />
      Willing to relocate</label
    >
    <label
      ><input type="checkbox" data-path="preferences.needSponsorship" /> Need
      visa sponsorship</label
    >

    <h2>Skills (years of experience)</h2>
    <p style="font-size: 12px; color: #666">
      Used to answer "X+ years of Y?" questions. Use 0 for skills you haven't
      used.
    </p>
    <div id="skills"></div>
    <div style="display: flex; gap: 8px; margin-top: 8px">
      <input id="new-skill" placeholder="Skill name, e.g. Spring Boot" />
      <input
        id="new-years"
        type="number"
        min="0"
        step="0.5"
        placeholder="Years"
        style="width: 90px"
      />
      <button id="add-skill" type="button" style="margin: 0">Add</button>
    </div>

    <button id="save">Save</button>
    <span id="status"></span>
    <h2>Backup</h2>
    <button id="export" type="button">Export JSON</button>
    <button id="import" type="button">Import JSON</button>
    <input id="import-file" type="file" accept="application/json" hidden />
    <script type="module" src="./options.ts"></script>
  </body>
</html>
