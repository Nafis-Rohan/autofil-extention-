<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Test Skill Rules</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 520px;
        margin: 24px auto;
      }
      label {
        display: block;
        margin: 14px 0 2px;
        font-size: 13px;
      }
      input,
      select {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }
      input[type="radio"] {
        width: auto;
      }
      fieldset {
        margin-top: 14px;
      }
      fieldset label {
        display: inline-block;
        margin-right: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Skill rules test</h2>
    <form>
      <fieldset>
        <legend>Do you have 1+ years of experience with Spring Boot?</legend>
        <label><input type="radio" name="q1" /> Yes</label>
        <label><input type="radio" name="q1" /> No</label>
      </fieldset>

      <label for="q2">Do you have 3+ years of experience with Django?</label>
      <select id="q2" name="q2">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="q3"
        >How many years of experience do you have with Spring Boot?</label
      >
      <input id="q3" name="q3" type="number" />

      <label for="q4">Years of experience with Python</label>
      <input id="q4" name="q4" />

      <label for="q5">Years of experience with Django</label>
      <select id="q5" name="q5">
        <option value="">Select...</option>
        <option>Less than 1 year</option>
        <option>1-3 years</option>
        <option>3-5 years</option>
        <option>5+ years</option>
      </select>

      <fieldset>
        <legend>
          Do you have 2+ years of experience with Spring Boot or Django?
        </legend>
        <label><input type="radio" name="q6" /> Yes</label>
        <label><input type="radio" name="q6" /> No</label>
      </fieldset>

      <label for="q7">Graduation Year</label>
      <input id="q7" name="q7" />
    </form>
  </body>
</html>
