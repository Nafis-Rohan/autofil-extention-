<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Test Job Form</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 24px auto;
      }
      label {
        display: block;
        margin: 10px 0 2px;
        font-size: 13px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }
      input[type="radio"] {
        width: auto;
      }
      fieldset {
        margin-top: 12px;
      }
      fieldset label {
        display: inline-block;
        margin-right: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Apply: Backend Engineer</h2>
    <form>
      <label for="fn">First Name</label>
      <input id="fn" name="first_name" />

      <label for="ln">Last Name</label>
      <input id="ln" name="last_name" />

      <label for="em">Email Address</label>
      <input id="em" name="email" type="email" />

      <label for="ph">Mobile Number</label>
      <input id="ph" name="phone" type="tel" />

      <label for="li">LinkedIn Profile</label>
      <input id="li" name="linkedin_url" />

      <label for="gh">GitHub</label>
      <input id="gh" name="github" placeholder="https://github.com/..." />

      <label for="city">Current City</label>
      <input id="city" name="city" />

      <label for="uni">University</label>
      <input id="uni" name="university" />

      <label for="cgpa">CGPA</label>
      <input id="cgpa" name="cgpa" />

      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select...</option>
        <option>India</option>
        <option>Bangladesh</option>
        <option>Pakistan</option>
      </select>

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">Select...</option>
        <option>Female</option>
        <option>Male</option>
        <option>Prefer not to say</option>
      </select>

      <label for="wm">Work Mode</label>
      <select id="wm" name="work_mode">
        <option value="">Select...</option>
        <option>On-site</option>
        <option>Remote (Work from home)</option>
        <option>Hybrid</option>
      </select>

      <fieldset>
        <legend>Are you willing to relocate?</legend>
        <label><input type="radio" name="relocate" value="y" /> Yes</label>
        <label><input type="radio" name="relocate" value="n" /> No</label>
      </fieldset>

      <fieldset>
        <legend>Do you require visa sponsorship?</legend>
        <label><input type="radio" name="sponsor" value="y" /> Yes</label>
        <label><input type="radio" name="sponsor" value="n" /> No</label>
      </fieldset>

      <fieldset>
        <legend>Job Type</legend>
        <label
          ><input type="radio" name="job_type" value="ft" /> Full-time</label
        >
        <label
          ><input type="radio" name="job_type" value="pt" /> Part-time</label
        >
        <label
          ><input type="radio" name="job_type" value="in" /> Internship</label
        >
        <label
          ><input type="radio" name="job_type" value="ct" /> Contract</label
        >
      </fieldset>

      <label for="cl">Cover Letter</label>
      <textarea id="cl" name="cover_letter" rows="5"></textarea>
    </form>
  </body>
</html>
